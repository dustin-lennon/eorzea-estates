allowBuilds:
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  msw: true
  prisma: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true
# Refuse packages published < 24h ago (pnpm 11 default, made explicit).
# Keep in sync with renovate.json "minimumReleaseAge".
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Temporary: pulled in by #566/#567/#568 before they cleared pnpm's 24h
  # minimumReleaseAge window. Safe to remove after 2026-11-14T22:33Z.
  - '@ai-sdk/anthropic@4.0.105'
  - '@ai-sdk/gateway@4.0.146'
  - '@ai-sdk/provider-utils@5.0.81'
  - '@playwright/test@1.65.1'
  - ai@7.0.173
  - playwright-core@1.65.1
  - playwright@1.65.1
